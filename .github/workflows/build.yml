name: Build CV

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # needed to publish the Release asset

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile CV (xelatex)
        uses: xu-cheng/latex-action@v3
        with:
          root_file: cv.tex
          latexmk_use_xelatex: true

      - name: Rename for download
        run: cp cv.pdf Han_Zheng_CV.pdf

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Han_Zheng_CV
          path: Han_Zheng_CV.pdf

      - name: Publish to rolling 'latest' release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest CV (auto-built)
          files: Han_Zheng_CV.pdf
